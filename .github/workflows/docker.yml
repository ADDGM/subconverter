name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v1.2.3 or v1.3.0-beta.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}

jobs:
  resolve_release:
    name: Resolve Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      minor: ${{ steps.release.outputs.minor }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      ghcr-image: ${{ steps.source.outputs.ghcr-image }}
      commit-sha: ${{ steps.source.outputs.commit-sha }}
    steps:
      - name: Resolve and validate release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Release tag must use vX.Y.Z or vX.Y.Z-beta.N, for example v1.2.3 or v1.3.0-beta.1"
            exit 1
          fi

          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%%-*}"
          MINOR="${BASE_VERSION%.*}"

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "minor=${MINOR}"
            if [[ "$VERSION" == *-beta.* ]]; then
              echo "prerelease=true"
            else
              echo "prerelease=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Validate Docker Hub image setting
        run: |
          test -n "$DOCKER_IMAGE" || {
            echo "Repository variable DOCKER_IMAGE is required, for example addgm/subconverter"
            exit 1
          }

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Validate source version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          SOURCE_VERSION=$(sed -nE 's/^#define[[:space:]]+VERSION[[:space:]]+"([^"]+)".*/\1/p' src/version.h)
          EXPECTED_VERSION="${RELEASE_TAG}-mihomo"

          if [[ -z "$SOURCE_VERSION" ]]; then
            echo "Unable to read VERSION from src/version.h"
            exit 1
          fi

          if [[ "$SOURCE_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Release tag and source version do not match"
            echo "Expected source version: $EXPECTED_VERSION"
            echo "Actual source version:   $SOURCE_VERSION"
            exit 1
          fi

          echo "Validated source version: $SOURCE_VERSION"

      - name: Resolve source metadata
        id: source
        run: |
          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "ghcr-image=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "commit-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  linux_release:
    name: Linux ${{ matrix.arch }} Release
    needs: resolve_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            artifact: subconverter_linux32
            os: ubuntu-latest
          - arch: amd64
            artifact: subconverter_linux64
            os: ubuntu-latest
          - arch: armv7
            artifact: subconverter_armv7
            os: ubuntu-24.04-arm
          - arch: aarch64
            artifact: subconverter_aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve_release.outputs.tag }}
      - name: Build
        run: docker run --rm -v "$GITHUB_WORKSPACE:/root/workdir" multiarch/alpine:${{ matrix.arch }}-latest-stable /bin/sh -c "apk add bash git nodejs npm && cd /root/workdir && chmod +x scripts/build.alpine.release.sh && bash scripts/build.alpine.release.sh"
      - name: Package release asset
        run: tar czf ${{ matrix.artifact }}.tar.gz subconverter
      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  macos_release:
    name: macOS ${{ matrix.arch }} Release
    needs: resolve_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            artifact: subconverter_darwin64
            os: macos-15-intel
          - arch: arm
            artifact: subconverter_darwinarm
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve_release.outputs.tag }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build
        run: bash scripts/build.macos.release.sh
      - name: Package release asset
        run: tar czf ${{ matrix.artifact }}.tar.gz subconverter
      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  windows_release:
    name: Windows ${{ matrix.arch }} Release
    needs: resolve_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            artifact: subconverter_win32
            env: i686
            msystem: MINGW32
          - arch: amd64
            artifact: subconverter_win64
            env: x86_64
            msystem: MINGW64
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve_release.outputs.tag }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: base-devel git mingw-w64-${{ matrix.env }}-gcc mingw-w64-${{ matrix.env }}-cmake mingw-w64-${{ matrix.env }}-pcre2 patch
          msystem: ${{ matrix.msystem }}
          path-type: inherit
      - name: Build
        run: bash scripts/build.windows.release.sh
      - name: Package release asset
        run: 7z a ${{ matrix.artifact }}.7z subconverter/
      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.7z
          if-no-files-found: error
          retention-days: 1

  build_images:
    name: Build ${{ matrix.platform }} for Docker Hub and GHCR
    needs: resolve_release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/386
            os: ubuntu-latest
          - platform: linux/arm/v7
            os: ubuntu-24.04-arm
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      GHCR_IMAGE: ${{ needs.resolve_release.outputs.ghcr-image }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve_release.outputs.tag }}
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and export digest
        id: build
        uses: docker/build-push-action@v5
        with:
          platforms: ${{ matrix.platform }}
          context: .
          file: scripts/Dockerfile
          outputs: type=image,"name=${{ env.DOCKER_IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=release-${{ env.PLATFORM_PAIR }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge_dockerhub:
    name: Merge Docker Hub Manifest
    needs:
      - resolve_release
      - build_images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests-dockerhub
          pattern: digest-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Create and push manifest
        working-directory: /tmp/digests-dockerhub
        env:
          VERSION: ${{ needs.resolve_release.outputs.version }}
          MINOR: ${{ needs.resolve_release.outputs.minor }}
          PRERELEASE: ${{ needs.resolve_release.outputs.prerelease }}
        run: |
          TAGS=(-t "$DOCKER_IMAGE:$VERSION")
          if [[ "$PRERELEASE" != "true" ]]; then
            TAGS+=(-t "$DOCKER_IMAGE:$MINOR" -t "$DOCKER_IMAGE:latest")
          fi
          DIGESTS=(*)
          test "${#DIGESTS[@]}" -gt 0
          SOURCES=()
          for digest in "${DIGESTS[@]}"; do
            SOURCES+=("$DOCKER_IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${TAGS[@]}" "${SOURCES[@]}"
      - name: Inspect image
        id: image
        env:
          IMAGE_REFERENCE: ${{ env.DOCKER_IMAGE }}:${{ needs.resolve_release.outputs.version }}
        run: |
          inspection="$(docker buildx imagetools inspect "$IMAGE_REFERENCE")"
          printf '%s\n' "$inspection"
          digest="$(printf '%s\n' "$inspection" | awk '$1 == "Digest:" { print $2; exit }')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unable to resolve Docker Hub manifest digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  merge_ghcr:
    name: Merge GHCR Manifest
    needs:
      - resolve_release
      - build_images
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      reference: ${{ steps.image.outputs.reference }}
      digest: ${{ steps.image.outputs.digest }}
    env:
      GHCR_IMAGE: ${{ needs.resolve_release.outputs.ghcr-image }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests-ghcr
          pattern: digest-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        working-directory: /tmp/digests-ghcr
        env:
          VERSION: ${{ needs.resolve_release.outputs.version }}
          MINOR: ${{ needs.resolve_release.outputs.minor }}
          PRERELEASE: ${{ needs.resolve_release.outputs.prerelease }}
        run: |
          TAGS=(-t "$GHCR_IMAGE:$VERSION")
          if [[ "$PRERELEASE" != "true" ]]; then
            TAGS+=(-t "$GHCR_IMAGE:$MINOR" -t "$GHCR_IMAGE:latest")
          fi
          DIGESTS=(*)
          test "${#DIGESTS[@]}" -gt 0
          SOURCES=()
          for digest in "${DIGESTS[@]}"; do
            SOURCES+=("$GHCR_IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${TAGS[@]}" "${SOURCES[@]}"
      - name: Inspect image
        id: image
        env:
          IMAGE_REFERENCE: ${{ env.GHCR_IMAGE }}:${{ needs.resolve_release.outputs.version }}
        run: |
          inspection="$(docker buildx imagetools inspect "$IMAGE_REFERENCE")"
          printf '%s\n' "$inspection"
          digest="$(printf '%s\n' "$inspection" | awk '$1 == "Digest:" { print $2; exit }')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unable to resolve GHCR manifest digest"
            exit 1
          fi
          {
            echo "reference=$IMAGE_REFERENCE"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

  github_release:
    name: Publish GitHub Release
    needs:
      - resolve_release
      - linux_release
      - macos_release
      - windows_release
      - merge_dockerhub
      - merge_ghcr
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: |
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.7z' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > checksums.txt
          test -s checksums.txt
      - name: Generate release notes
        env:
          TAG: ${{ needs.resolve_release.outputs.tag }}
          PRERELEASE: ${{ needs.resolve_release.outputs.prerelease }}
          SOURCE_SHA: ${{ needs.resolve_release.outputs.commit-sha }}
          DOCKERHUB_REFERENCE: ${{ env.DOCKER_IMAGE }}:${{ needs.resolve_release.outputs.version }}
          DOCKERHUB_DIGEST: ${{ needs.merge_dockerhub.outputs.digest }}
          GHCR_REFERENCE: ${{ needs.merge_ghcr.outputs.reference }}
          GHCR_DIGEST: ${{ needs.merge_ghcr.outputs.digest }}
        run: |
          if [[ -z "$DOCKERHUB_REFERENCE" || -z "$GHCR_REFERENCE" ]]; then
            echo "Unable to resolve release image references"
            exit 1
          fi

          if [[ ! "$DOCKERHUB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] ||
             [[ ! "$GHCR_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unable to resolve release manifest digests"
            exit 1
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            RELEASE_TYPE="Beta / Prerelease"
            LATEST_STATUS="Not updated"
          else
            RELEASE_TYPE="Stable"
            LATEST_STATUS="Updated"
          fi

          {
            echo "## Release Information"
            echo
            echo "- Version: \`$TAG\`"
            echo "- Type: \`$RELEASE_TYPE\`"
            echo "- Commit: [$SOURCE_SHA](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/$SOURCE_SHA)"
            echo "- Workflow: [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            echo "## Native Assets"
            echo
            echo "- Linux: x86, amd64, armv7, aarch64"
            echo "- macOS: Intel, Apple Silicon"
            echo "- Windows: x86, amd64"
            echo "- SHA256: \`checksums.txt\`"
            echo
            echo "## Docker Images"
            echo
            echo "- Docker Hub: \`${DOCKERHUB_REFERENCE}@$DOCKERHUB_DIGEST\`"
            echo "- GHCR: \`${GHCR_REFERENCE}@$GHCR_DIGEST\`"
            echo "- Latest: \`$LATEST_STATUS\`"
          } > release-notes.md
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve_release.outputs.tag }}
          name: subconverter ${{ needs.resolve_release.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
          overwrite_files: true
          append_body: false
          draft: false
          prerelease: ${{ needs.resolve_release.outputs.prerelease }}
          make_latest: ${{ needs.resolve_release.outputs.prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.7z
            release-assets/checksums.txt

  notify:
    name: Telegram Release Notification
    env:
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
    if: ${{ always() }}
    needs:
      - resolve_release
      - linux_release
      - macos_release
      - windows_release
      - merge_dockerhub
      - merge_ghcr
      - github_release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Telegram notification
        if: ${{ env.TELEGRAM_TO != '' && env.TELEGRAM_TOKEN != '' }}
        continue-on-error: true
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ env.TELEGRAM_TO }}
          token: ${{ env.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *subconverter 发布报告*

            *状态*: `${{ (needs.resolve_release.result == 'failure' || needs.linux_release.result == 'failure' || needs.macos_release.result == 'failure' || needs.windows_release.result == 'failure' || needs.merge_dockerhub.result == 'failure' || needs.merge_ghcr.result == 'failure' || needs.github_release.result == 'failure') && '❌ 发布失败' || (needs.resolve_release.result == 'cancelled' || needs.linux_release.result == 'cancelled' || needs.macos_release.result == 'cancelled' || needs.windows_release.result == 'cancelled' || needs.merge_dockerhub.result == 'cancelled' || needs.merge_ghcr.result == 'cancelled' || needs.github_release.result == 'cancelled') && '⚪ 发布取消' || needs.github_release.result == 'success' && '🚀 发布成功' || '⚠️ 发布未完成' }}`
            *标签*: `${{ needs.resolve_release.outputs.tag }}`
            *类型*: `${{ needs.resolve_release.outputs.prerelease == 'true' && 'Beta / Prerelease' || 'Stable' }}`
            *解析*: `${{ needs.resolve_release.result }}`
            *Linux*: `${{ needs.linux_release.result }}`
            *macOS*: `${{ needs.macos_release.result }}`
            *Windows*: `${{ needs.windows_release.result }}`
            *Docker Hub*: `${{ needs.merge_dockerhub.result }}`
            *GHCR*: `${{ needs.merge_ghcr.result }}`
            *GitHub Release*: `${{ needs.github_release.result }}`
            *提交*: [${{ needs.resolve_release.outputs.commit-sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.resolve_release.outputs.commit-sha }})
            *工作流*: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            *触发人*: `${{ github.actor }}`
      - name: Report skipped notification
        if: ${{ env.TELEGRAM_TO == '' || env.TELEGRAM_TOKEN == '' }}
        run: |
          {
            echo "### Telegram notification skipped"
            echo
            echo "TELEGRAM_TO or TELEGRAM_TOKEN is not configured."
          } >> "$GITHUB_STEP_SUMMARY"
